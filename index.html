
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    
    <!-- Dynamic meta tags based on domain -->
    <script>
      (function() {
        const host = window.location.hostname.toLowerCase();
        let title, description;
        
        if (host.includes('swankyboyz')) {
          title = "SwankyBoyz | Premium Men's Lifestyle & Deals";
          description = "Discover the best deals on premium men's watches, grooming, tech, and fashion. Curated reviews and exclusive affiliate deals.";
        } else if (host.includes('vaughnsterlingtours')) {
          title = 'Vaughn Sterling Tours | Digital Nomad Travel & Relocation Guide';
          description = 'Your guide to relocating abroad as a digital nomad. Destination guides, cost breakdowns, and travel tips from South Africa to Southeast Asia.';
        } else {
          title = 'Vaughn Sterling | AI-Powered Niche Sites & Freelance Services';
          description = 'Custom AI-powered niche websites, content automation, and freelance development services. Build and monetize your online presence.';
        }
        
        document.title = title;
        
        // Create meta description
        const metaDesc = document.createElement('meta');
        metaDesc.name = 'description';
        metaDesc.content = description;
        document.head.appendChild(metaDesc);
        
        // OpenGraph meta
        const ogTitle = document.createElement('meta');
        ogTitle.setAttribute('property', 'og:title');
        ogTitle.content = title;
        document.head.appendChild(ogTitle);
        
        const ogDesc = document.createElement('meta');
        ogDesc.setAttribute('property', 'og:description');
        ogDesc.content = description;
        document.head.appendChild(ogDesc);
        
        const ogType = document.createElement('meta');
        ogType.setAttribute('property', 'og:type');
        ogType.content = 'website';
        document.head.appendChild(ogType);
        
        // Twitter meta
        const twitterCard = document.createElement('meta');
        twitterCard.name = 'twitter:card';
        twitterCard.content = 'summary_large_image';
        document.head.appendChild(twitterCard);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
